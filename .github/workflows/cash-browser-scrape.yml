name: cash-browser-scrape

# Google Flights CASH-fare browser scrape, run entirely within this repo (GH Actions / Azure IP
# serves Google Flights cleanly at volume). The scrapers/ config/ pp_db/ pipeline/ packages are
# VENDORED from points-pilot-scrapers (see VENDORED_DELTA.md), so no cross-repo checkout / PAT is
# needed. Headful Chrome under xvfb. Sharded across parallel runs (a whole route stays on one
# shard) — coverage → scrape → match → upsert into Postgres `pp.cash_fares` (powers CPP).
# The legacy Fly `point-pilot-gflights` machine was stopped on 2026-06-30; Actions owns capacity.
on:
  workflow_dispatch:
  schedule:
    - cron: "15 6,14,22 * * *"  # 3x/day, clear of the 08-11 UTC browser block; peak jobs stay <20

permissions:
  contents: read
  packages: read

concurrency:
  group: cash-browser-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/louie3697/points-pilot-jobs-scraper:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --shm-size=2g
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v6
      - name: Install OTLP protobuf support if absent
        run: python -c 'import opentelemetry.proto' || pip install -r requirements-telemetry.txt
      - name: Scrape Google Flights cash fares (headful Chrome under xvfb, Azure IP)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          CASH_SHARDS: "6"
          CASH_SHARD_INDEX: ${{ matrix.shard }}
          CASH_SCRAPE_DAYS: "45"
          CASH_TOP_ROUTES: "800"
        run: xvfb-run -a python cash_browser_scrape.py
