name: delta-browser-scrape

# Delta browser scrape, run entirely within this repo (GH Actions / Azure IP clears Delta's
# Akamai edge block — HTTP 200 — where Fly's IP gets 444). The scrapers/ config/ pp_db/ pipeline/
# packages are VENDORED from points-pilot-scrapers (see VENDORED_DELTA.md), so no cross-repo
# checkout / PAT is needed. Headful Chrome under xvfb (Akamai challenges headless). Writes Delta
# rows into Postgres `flights`. While Delta returns HTTP 444, scheduled work is a single monthly,
# one-route recovery probe. Manual single-route dispatch remains available.
on:
  workflow_dispatch:
    inputs:
      origin:
        description: "Origin IATA (single-route on-demand mode). Blank = popular-routes cron."
        required: false
        default: ""
      destination:
        description: "Destination IATA (single-route on-demand mode)."
        required: false
        default: ""
      dates:
        description: "Comma-separated ISO dates (YYYY-MM-DD). Blank = one recovery date."
        required: false
        default: ""
  schedule:
    - cron: "0 8 1 * *"  # one monthly recovery probe while HTTP 444 persists

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ inputs.origin != '' && format('delta-ondemand-{0}-{1}', inputs.origin, inputs.destination) || 'delta-browser-scrape' }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/louie3697/points-pilot-jobs-scraper:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --shm-size=2g
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [0]
    steps:
      - uses: actions/checkout@v6
      - name: Install OTLP protobuf support if absent
        run: python -c 'import opentelemetry.proto' || pip install -r requirements-telemetry.txt
      - name: Scrape Delta (headful Chrome under xvfb, Azure IP)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          DELTA_SCRAPE_DAYS: "1"
          CRON_TIME_BUDGET_S: "7200"
          DELTA_SHARDS: "1"
          DELTA_SHARD_INDEX: ${{ matrix.shard }}
          DELTA_MAX_LEGS_PER_SHARD: "1"
          DELTA_ROUTE_ORIGIN: ${{ inputs.origin }}
          DELTA_ROUTE_DEST: ${{ inputs.destination }}
          DELTA_ROUTE_DATES: ${{ inputs.dates }}
        run: xvfb-run -a python delta_browser_scrape.py
