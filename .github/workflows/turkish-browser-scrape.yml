name: turkish-browser-scrape

# Turkish Airlines Miles&Smiles award scrape, run entirely in this repo (GH Actions / Azure IP
# clears Turkish's TLS-fingerprint block + PerimeterX where Fly's IP can't). While the upstream
# response is unsuccessful, scheduled work is a monthly one-route, one-date recovery probe. Headful
# Chrome under xvfb. Writes Turkish rows into Postgres `flights`. The availability API is the public
# /api/v1/availability (moduleType:AWARD); session headers are client-generated UUIDs and PX 428
# crypto-challenges are auto-solved + retried in-page. (websockets pinned <15 — see requirements.)
on:
  workflow_dispatch:
    inputs:
      origin:
        description: "Origin IATA (single-route on-demand mode). Blank = popular-routes cron."
        required: false
        default: ""
      destination:
        description: "Destination IATA (single-route on-demand mode)."
        required: false
        default: ""
      dates:
        description: "Comma-separated ISO dates (YYYY-MM-DD). Blank = one recovery date."
        required: false
        default: ""
  schedule:
    - cron: "0 10 1 * *"   # day 1 at 10:00 UTC (staggered clear of delta 08:00 + southwest 09:00)

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ inputs.origin != '' && format('turkish-ondemand-{0}-{1}', inputs.origin, inputs.destination) || 'turkish-browser-scrape' }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/louie3697/points-pilot-jobs-scraper:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --shm-size=2g
    timeout-minutes: 60
    # Turkish scheduled recovery is intentionally limited to one route and one date while the
    # upstream response is unsuccessful. Manual single-route dispatch remains available.
    strategy:
      fail-fast: false
      matrix:
        shard: [0]
    steps:
      - uses: actions/checkout@v6
      - name: Install OTLP protobuf support if absent
        run: python -c 'import opentelemetry.proto' || pip install -r requirements-telemetry.txt
      - name: Scrape Turkish (headful Chrome under xvfb, Azure IP)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          TURKISH_SCRAPE_DAYS: "1"
          TURKISH_SHARDS: "1"
          TURKISH_MAX_LEGS_PER_SHARD: "1"
          TURKISH_SHARD_INDEX: ${{ matrix.shard }}
          TURKISH_ROUTE_ORIGIN: ${{ inputs.origin }}
          TURKISH_ROUTE_DEST: ${{ inputs.destination }}
          TURKISH_ROUTE_DATES: ${{ inputs.dates }}
        run: xvfb-run -a python turkish_browser_scrape.py
