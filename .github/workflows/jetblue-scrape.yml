name: JetBlue award scrape

on:
  workflow_dispatch:
  schedule:
    # Monthly one-route/one-date canary while JetBlue returns HTTP 406. Manual dispatch stays
    # available for unblock checks without burning a known-failing scheduled request every day.
    - cron: "37 20 1 * *"

permissions:
  contents: read

concurrency:
  group: jetblue-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: scrape
        run: python jetblue_scrape.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          JETBLUE_SHARDS: "1"
          JETBLUE_MAX_LEGS_PER_SHARD: "1"
          JETBLUE_SHARD_INDEX: ${{ matrix.shard }}
          # One-date canary while JetBlue returns HTTP 406: keep monthly visibility without enough
          # consecutive blocked responses to trip the run-level circuit breaker.
          JETBLUE_SCRAPE_DAYS: "1"
